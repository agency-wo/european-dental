# Deploys site/ to Cloudflare Workers on every push to main, with an API token from the Cloudflare account
# that hosts the site. The token only has rights on that account, so the deploy cannot land anywhere else.
# Two repository secrets are needed: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Until both exist the
# job says so and stops without failing. Nobody deploys from a local wrangler.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: The committed site is what its sources build
        run: node _tools/build.mjs --check

      - name: Deploy to Cloudflare Workers
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare is not connected yet: add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets."
            exit 0
          fi
          npx --yes wrangler@4 deploy
