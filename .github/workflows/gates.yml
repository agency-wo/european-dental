# The gates that need no browser, on every push and pull request. The browser gates (smoke, weigh,
# screenshots) run locally in the installed Edge before each push; see README.md.
# Read-only: this workflow holds no secret and deploys nothing.
name: gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The committed site is what its sources build
        run: node _tools/build.mjs --check

      - name: Build again to write the page inventory, and change nothing else
        run: |
          node _tools/build.mjs
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: Page gate
        run: python _tools/verify.py

      - name: Placeholders, old brand, dashes, emoji
        run: node _tools/check-placeholders.mjs --preview

      - name: Contrast
        run: python _tools/contrast.py

      - name: Tools
        working-directory: _tools
        run: npm ci --no-audit --no-fund

      - name: Excluded images stay out
        run: node _tools/check-images.mjs
