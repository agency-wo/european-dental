# The preview on GitHub Pages, at https://agency-wo.github.io/european-dental/, until Cloudflare serves
# the site. The committed site/ is copied with the /european-dental base path in front of every address
# (the copy fails if any internal reference would 404), then published. site/ itself is not changed.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: The committed site is what its sources build
        run: node _tools/build.mjs --check

      - name: Copy with the base path, and check every internal reference
        run: node _tools/pages-dist.mjs /european-dental

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _dist/pages
      - id: deployment
        uses: actions/deploy-pages@v4
